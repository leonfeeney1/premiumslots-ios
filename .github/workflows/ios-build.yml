name: iOS build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build PremiumSlots (unsigned)
    runs-on: macos-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: List project targets
        run: xcodebuild -list -project PremiumSlots.xcodeproj

      - name: Build for simulator
        run: |
          xcodebuild build \
            -project PremiumSlots.xcodeproj \
            -target PremiumSlots \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO

      - name: Build unsigned IPA
        # xcodebuild archive needs a shared scheme, which this hand-written
        # project does not have, so build for a real device instead and
        # package the resulting .app as an unsigned IPA. The .app is built
        # with signing disabled, ready for the user to sign when sideloading.
        run: |
          xcodebuild build \
            -project PremiumSlots.xcodeproj \
            -target PremiumSlots \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO
          APP_PATH=build/DerivedData/Build/Products/Release-iphoneos/PremiumSlots.app
          test -d "$APP_PATH" || { echo "No .app found at $APP_PATH"; exit 1; }
          mkdir -p build/Payload
          cp -R "$APP_PATH" build/Payload/
          cd build && zip -r PremiumSlots-unsigned.ipa Payload

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: PremiumSlots-unsigned-ipa
          path: build/PremiumSlots-unsigned.ipa
          retention-days: 30
