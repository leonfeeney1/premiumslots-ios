<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 64" width="100%" height="100%" fill="none" preserveAspectRatio="xMinYMid meet">
  <defs>
    <!-- Color Gradients (Sharp Vectors, Light Mode) -->
    <linearGradient id="brandGradientLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#55B7F7" />
      <stop offset="50%" stop-color="#1E85CC" />
      <stop offset="100%" stop-color="#0F548B" />
    </linearGradient>

    <linearGradient id="blueGradientLight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2D9CE5" />
      <stop offset="100%" stop-color="#1E85CC" />
    </linearGradient>

    <linearGradient id="darkShieldLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="50%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <linearGradient id="borderGradientLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.9" />
      <stop offset="40%" stop-color="#0284C7" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.9" />
    </linearGradient>
  </defs>

  <style>
    .brand-title-light {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Plus Jakarta Sans', sans-serif;
      font-weight: 900;
      font-size: 32px;
      letter-spacing: -0.5px;
    }
    .brand-subtitle-light {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'JetBrains Mono', monospace;
      font-weight: 700;
      font-size: 8.5px;
      letter-spacing: 3px;
      text-transform: uppercase;
    }
  </style>

  <!-- EMBLEM ICON (Left Anchor: 52x52) -->
  <g transform="translate(6, 6)">
    <!-- Base Rounded Shield Frame -->
    <rect x="0" y="0" width="52" height="52" rx="15" fill="url(#darkShieldLight)" stroke="url(#borderGradientLight)" stroke-width="1.8" />
    
    <!-- Inner High-Tech Edge Border Accent -->
    <rect x="2.5" y="2.5" width="47" height="47" rx="12.5" fill="none" stroke="#38BDF8" stroke-opacity="0.4" stroke-width="1" />

    <!-- Stylized Geometric 'P' -->
    <path d="M 15 13 C 15 12.2 15.6 11.5 16.4 11.5 L 24.5 11.5 C 32 11.5 37 15.5 37 22.5 C 37 29 32 33.5 24.5 33.5 L 21 33.5 L 21 39.5 C 21 40.3 20.3 41 19.5 41 L 16.4 41 C 15.6 41 15 40.3 15 39.5 Z" 
          fill="url(#brandGradientLight)" />

    <!-- Inner 'P' Cutout -->
    <path d="M 21 16.5 L 24 16.5 C 28.5 16.5 31.5 18.5 31.5 22.5 C 31.5 26.2 28.5 28.5 24 28.5 L 21 28.5 Z" 
          fill="#020617" />

    <!-- Angular Slot Energy Tab -->
    <path d="M 25 32 L 35.5 21.5 C 36.3 20.7 37.8 21.3 37.8 22.5 L 37.8 36 C 37.8 36.8 37.2 37.5 36.4 37.5 L 26.5 37.5 C 25.2 37.5 24.5 36 25 35 Z" 
          fill="url(#blueGradientLight)" opacity="0.95" />

    <!-- 3 Glowing Digital Slot Level Indicators -->
    <rect x="41" y="17" width="2.5" height="5" rx="1.25" fill="#38BDF8" opacity="0.95" />
    <rect x="41" y="24" width="2.5" height="5" rx="1.25" fill="#0284C7" opacity="0.8" />
    <rect x="41" y="31" width="2.5" height="5" rx="1.25" fill="#0369A1" opacity="0.6" />

    <!-- Crown Sparkle Star -->
    <path d="M 40 9 L 41.5 12.5 L 45 14 L 41.5 15.5 L 40 19 L 38.5 15.5 L 35 14 L 38.5 12.5 Z" 
          fill="#FFFFFF" />
  </g>

  <!-- LOGO TYPOGRAPHY (Single Word Lockup: PremiumSlots) -->
  <text x="70" y="37" class="brand-title-light">
    <tspan fill="#0F172A">Premium</tspan><tspan fill="#0284C7">Slots</tspan>
  </text>

  <!-- Subtitle Tagline Badge -->
  <g transform="translate(71, 51)">
    <circle cx="2" cy="3.5" r="2" fill="#0284C7" />
    <text x="9" y="6.5" class="brand-subtitle-light" fill="#0369A1" fill-opacity="0.95">SHARED ACCESS PLATFORM</text>
    <line x1="225" y1="3.5" x2="265" y2="3.5" stroke="#0284C7" stroke-opacity="0.4" stroke-width="1.2" stroke-linecap="round" />
    <circle cx="269" cy="3.5" r="1.2" fill="#0284C7" fill-opacity="0.7" />
  </g>
</svg>
