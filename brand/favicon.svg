<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <linearGradient id="favBrandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A5E5FF" />
      <stop offset="35%" stop-color="#55B7F7" />
      <stop offset="75%" stop-color="#2D9CE5" />
      <stop offset="100%" stop-color="#1460A5" />
    </linearGradient>
    <linearGradient id="favCyanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7FCDFF" />
      <stop offset="50%" stop-color="#55B7F7" />
      <stop offset="100%" stop-color="#2D9CE5" />
    </linearGradient>
    <linearGradient id="favSilverGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="60%" stop-color="#F0F4F8" />
      <stop offset="100%" stop-color="#94A3B8" />
    </linearGradient>
    <linearGradient id="favDarkShield" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#182230" />
      <stop offset="50%" stop-color="#0E1622" />
      <stop offset="100%" stop-color="#060A10" />
    </linearGradient>
    <linearGradient id="favBorderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#55B7F7" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#2D9CE5" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#0E1622" stop-opacity="0.9" />
    </linearGradient>
  </defs>

  <!-- Base Rounded Shield Frame -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#favDarkShield)" stroke="url(#favBorderGrad)" stroke-width="2" />

  <!-- Inner Rim -->
  <rect x="5" y="5" width="54" height="54" rx="13" fill="none" stroke="#2D9CE5" stroke-opacity="0.2" stroke-width="1" />

  <!-- Geometric 'P' Stem -->
  <path d="M 18 16 C 18 15 18.8 14 20 14 L 30 14 C 38 14 43 19 43 27 C 43 34.5 38 39.5 30 39.5 L 26 39.5 L 26 47 C 26 48 25.2 49 24 49 L 20 49 C 18.8 49 18 48 18 47 Z" 
        fill="url(#favBrandGrad)" />

  <!-- Inner 'P' Cutout -->
  <path d="M 25 20 L 29 20 C 34 20 37 23 37 27 C 37 31 34 33.5 29 33.5 L 25 33.5 Z" 
        fill="#0B131E" />

  <!-- Angular Slot Energy Tab -->
  <path d="M 31 37 L 43 25 C 44 24 45.5 24.8 45.5 26.2 L 45.5 43 C 45.5 44 44.8 44.8 43.8 44.8 L 32.5 44.8 C 31 44.8 30.2 43 31 41.8 Z" 
        fill="url(#favCyanGrad)" />

  <!-- Digital Slot Level Indicators -->
  <rect x="49" y="22" width="3" height="6" rx="1.5" fill="#55B7F7" />
  <rect x="49" y="30" width="3" height="6" rx="1.5" fill="#2D9CE5" opacity="0.8" />
  <rect x="49" y="38" width="3" height="6" rx="1.5" fill="#1460A5" opacity="0.6" />

  <!-- Specular Crown Sparkle -->
  <path d="M 47 11 L 48.5 15 L 52.5 16.5 L 48.5 18 L 47 22 L 45.5 18 L 41.5 16.5 L 45.5 15 Z" 
        fill="url(#favSilverGrad)" />
</svg>
